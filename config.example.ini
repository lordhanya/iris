[core]
# Enable debug logging
debug = false

# Disable face authentication (useful for emergencies)
disabled = false

[video]
# Camera device path (e.g., /dev/video0)
device = /dev/video0

# Capture resolution
width = 640
height = 480

# Frame rate
fps = 30

# Authentication timeout in seconds
timeout = 5

# Skip frame if lowest 1/8 of histogram exceeds this percentage
# Handles IR emitter flash frames
dark_threshold = 60

# Minimum face height in pixels
min_face_height = 80

# Maximum retries for camera open
max_retries = 3

[auth]
# Match threshold (lower = stricter, 0.6 is dlib default)
threshold = 0.6

# Number of samples to capture during enrollment
enroll_samples = 5

# Maximum capture attempts during enrollment
enroll_attempts = 10

[snapshots]
# Save snapshots of failed authentication attempts
save_failed = true

# Save snapshots of successful authentication attempts
save_successful = false

[paths]
# Encoding storage path (relative to project root)
encoding_path = data/user_face.npy

# Log directory (relative to project root)
log_dir = logs

# Debug frame directory (relative to project root)
debug_dir = logs/debug_frames
